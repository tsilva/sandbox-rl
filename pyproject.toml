[project]
name = "sandbox-rl"
version = "0.1.0"
description = "Reinforcement learning sandbox for Gymnasium environments"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "gymnasium[box2d]",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
