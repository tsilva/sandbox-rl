[project]
name = "sandbox-rl"
version = "0.1.0"
description = "Reinforcement learning sandbox for Gymnasium environments"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.13.0",
    "numpy",
    "gymnasium[box2d]",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0,<3",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "tomli>=2.2.0; python_version < '3.11'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = false
exclude-newer = "7 days"
constraint-dependencies = [
    "fsspec>=2026.6.0",
    "urllib3>=2.8.0",
    "mistralai!=2.4.6",
    "guardrails-ai!=0.10.1",
]
